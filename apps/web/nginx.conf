server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy the API through the same origin as the app. This is what keeps the
  # session cookie first-party — a cross-origin cookie would need SameSite=None
  # plus Secure, which does not work over plain HTTP on a bare VM.
  location /api/ {
    proxy_pass http://api:4000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Generated documents can take a moment to build.
    proxy_read_timeout 120s;
    client_max_body_size 20m;
  }

  # Hashed assets are immutable; the entry HTML must never be cached or a
  # deploy leaves browsers pointing at assets that no longer exist.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback: every unknown path is a client route.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
